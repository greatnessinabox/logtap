<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="url(#bgGrad)"/>

  <!-- Terminal/console bracket left -->
  <path d="M32 40 L48 56 L32 72" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Log lines -->
  <rect x="56" y="42" width="40" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="56" y="54" width="32" height="6" rx="3" fill="url(#accentGrad)"/>
  <rect x="56" y="66" width="36" height="6" rx="3" fill="#ffffff" opacity="0.6"/>

  <!-- Tap indicator / pulse dot -->
  <circle cx="96" cy="88" r="12" fill="url(#accentGrad)"/>
  <circle cx="96" cy="88" r="6" fill="#ffffff"/>
</svg>
